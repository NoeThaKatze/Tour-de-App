exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/blbci/web
    port: 3001
    env:
      PORT: "3001"
      VITE_API_URL: "/api"
  - name: server
    image: registry.tourde.cloud/blbci/server
    port: 8080
    env:
      FASTAPI_DB_HOST: 127.0.0.1
      FASTAPI_DB_NAME: product
      FASTAPI_DB_PASSWORD: "strongPassword?"
      FASTAPI_DB_PORT: "3306"
      FASTAPI_DB_USER: tda_user
      PORT: "8080"
  - name: mysql
    image: mysql
    tag: "8.4"
    env:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: tda_user
      MYSQL_PASSWORD: "strongPassword?"
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/blbci/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backend
    dockerfile: ./backend/docker/Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
